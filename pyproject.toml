[project]
name = "robotframework-evidence-reporter"
version = "0.4.0"
description = "Standalone business evidence reports per Robot Framework test"
authors = [{name = "Angel Gerardo Molina Valdez"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
keywords = ["robotframework", "selenium", "evidence", "reporting", "pabot"]
dependencies = ["robotframework>=7.0,<8.0", "jinja2>=3.1.6,<4.0", "pillow>=11.0,<14.0", "reportlab>=4.0,<5.0", "python-docx>=1.1,<2.0"]

[project.urls]
Homepage = "https://angel-valdezzz.github.io/robotframework-evidence-reporter/"
Repository = "https://github.com/angel-valdezzz/robotframework-evidence-reporter"

[project.scripts]
rf-evidence = "rf_evidence_reporter.cli:main"

[tool.poetry]
packages = [
    {include = "rf_evidence_reporter", from = "src"},
    {include = "EvidenceReporter", from = "src"},
]
include = [{path = "src/rf_evidence_reporter/templates/*.html", format = ["sdist", "wheel"]}, {path = "src/rf_evidence_reporter/assets/*", format = ["sdist", "wheel"]}]

[tool.poetry.group.dev.dependencies]
pygments = ">=2.19,<3"
pypdf = ">=6.0,<7.0"
robotframework-seleniumlibrary = "^6.9.0"
robotframework-pabot = "^5.1.0"
robotframework-robocop = "^9.1.0"
ruff = "^0.15.0"
mkdocs-material = {version = "^9.7.0", extras = ["imaging"]}

[tool.ruff]
line-length = 110

[tool.robocop.lint]
ignore = ["too-few-calls-in-test-case"]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
