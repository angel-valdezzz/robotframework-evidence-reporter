name: Quality and browser evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run ruff check src tests scripts docs/scripts
      - run: poetry run ruff format --check src tests scripts docs/scripts
      - run: poetry run robocop check tests examples
      - run: poetry run robocop format --check tests examples
      - run: poetry run python -m unittest discover -s tests -v
      - run: poetry run python scripts/validate.py
      - run: xvfb-run -a poetry run robot --outputdir results/browser examples/browser.robot
      - if: always()
        run: poetry run rf-evidence build results/browser-evidence --output results/browser/html
      - name: Install documentation image optimizer
        run: sudo apt-get update && sudo apt-get install -y pngquant
      - run: poetry run python docs/scripts/build_docs.py
      - run: poetry run robot --outputdir results/report-ui tests/report_ui.robot
      - name: Set up Node for Libdoc UI verification
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify native bilingual Libdoc menu
        run: |
          npm install --prefix build/libdoc-ui jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$PWD/build/libdoc-ui/node_modules" node docs/scripts/verify_libdoc_ui.cjs reference/keywords.html
          NODE_PATH="$PWD/build/libdoc-ui/node_modules" node docs/scripts/verify_navigation.cjs
      - name: Verificar documentación en navegador
        run: |
          python -m http.server 8765 --directory site >/tmp/evidence-docs-server.log 2>&1 &
          poetry run robot --outputdir results/docs-ui tests/docs_ui.robot
      - run: poetry build
      - run: poetry run python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-validation
          path: results/
          retention-days: 7
