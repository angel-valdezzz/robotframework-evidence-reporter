INHERIT: mkdocs.base.yml
site_description: Business evidence and individual reports for Robot Framework
site_url: https://angel-valdezzz.github.io/robotframework-evidence-reporter/
docs_dir: docs/en
site_dir: site
edit_uri: edit/main/docs/en/
theme:
  language: en
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Light mode
plugins:
  - search:
      lang: en
nav:
  - Home: index.md
  - User guide:
      - First evidence: getting-started.md
      - Usage: guide.md
      - Parallel execution and CI: parallel.md
  - Keyword reference: keywords.md
  - API reference: generation.md
  - Development and publishing: publishing.md
  - Visual examples: demo.md
