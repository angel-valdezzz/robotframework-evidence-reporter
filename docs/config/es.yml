INHERIT: base.yml
site_description: Evidencias de negocio y reportes individuales para Robot Framework
site_url: https://angel-valdezzz.github.io/robotframework-evidence-reporter/es/
docs_dir: ../es
site_dir: ../../build/site-es
edit_uri: edit/main/docs/es/
theme:
  custom_dir: ../overrides
  language: es
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Modo oscuro
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Modo claro
plugins:
  - search:
      lang: es
  - tags
  - social:
      cards_layout_options:
        background_color: "#101629"
        color: "#eef2ff"
        font_family: DejaVu Sans
  - privacy:
      # Mermaid is already bundled locally; skip Material's unused CDN fallback.
      assets_exclude:
        - unpkg.com/mermaid@11/*
  - optimize:
      # Avoid cached-file races in Material 9.7 during repeated builds.
      cache: false
      concurrency: 1
nav:
  - Inicio: index.md
  - Manual de usuario:
      - Primera evidencia: getting-started.md
      - Uso: guide.md
      - Paralelo y CI: parallel.md
  - Explorar por tema: topics.md
  - Referencia de keywords: reference/keywords.html
  - Referencia de API: generation.md
  - Desarrollo y publicación: publishing.md
  - Ejemplos visuales: demo.md
