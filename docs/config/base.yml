site_name: Evidence Reporter
site_description: Evidencias de negocio y reportes individuales para Robot Framework
site_url: https://angel-valdezzz.github.io/robotframework-evidence-reporter/
repo_url: https://github.com/angel-valdezzz/robotframework-evidence-reporter
repo_name: EvidenceReporter
theme:
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.tracking
    - navigation.path
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tooltips
    - content.tabs.link
    - search.highlight
    - search.suggest
plugins:
  - search:
      lang: es
extra_css:
  - assets/stylesheets/standard.css
  - assets/stylesheets/extra.css
  - assets/stylesheets/visual.css
  - assets/stylesheets/landing.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - abbr
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - assets/mermaid.min.js
  - assets/keyword-links.js
  - assets/landing.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/angel-valdezzz/robotframework-evidence-reporter
      name: Evidence Reporter on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/robotframework-evidence-reporter/
      name: Evidence Reporter on PyPI
  alternate:
    - name: English
      link: https://angel-valdezzz.github.io/robotframework-evidence-reporter/
      lang: en
    - name: Español
      link: https://angel-valdezzz.github.io/robotframework-evidence-reporter/es/
      lang: es

copyright: Copyright &copy; Angel Gerardo Molina Valdez · MIT
