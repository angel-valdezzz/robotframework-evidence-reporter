INHERIT: base.yml
site_description: Business evidence and individual reports for Robot Framework
site_url: https://angel-valdezzz.github.io/robotframework-evidence-reporter/
docs_dir: docs/en
site_dir: site
edit_uri: edit/main/docs/en/
theme:
  language: en
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Light mode
plugins:
  - search:
      lang: en
  - tags
  - social:
      cards_layout_options:
        background_color: "#101629"
        color: "#eef2ff"
        font_family: DejaVu Sans
  - privacy:
      # Mermaid is already bundled locally; skip Material's unused CDN fallback.
      assets_exclude:
        - unpkg.com/mermaid@11/*
  - optimize:
      # Avoid cached-file races in Material 9.7 during repeated builds.
      cache: false
      concurrency: 1
nav:
  - Home: index.md
  - User guide:
      - First evidence: getting-started.md
      - Usage: guide.md
      - Parallel execution and CI: parallel.md
  - Browse by topic: topics.md
  - Keyword reference: reference/keywords.html
  - API reference: generation.md
  - Development and publishing: publishing.md
  - Visual examples: demo.md
