site_name: Evidence Reporter
site_description: Evidencias de negocio y reportes individuales para Robot Framework
site_url: https://angel-valdezzz.github.io/robotframework-evidence-reporter/
repo_url: https://github.com/angel-valdezzz/robotframework-evidence-reporter
repo_name: Evidence Reporter
theme:
  custom_dir: overrides
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
plugins:
  - search:
      lang: es
extra_css:
  - assets/stylesheets/standard.css
  - assets/stylesheets/extra.css
  - assets/stylesheets/visual.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  alternate:
    - name: English
      link: https://angel-valdezzz.github.io/robotframework-evidence-reporter/
      lang: en
    - name: Español
      link: https://angel-valdezzz.github.io/robotframework-evidence-reporter/es/
      lang: es
